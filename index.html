      </div>

      <canvas class="safari-canvas" id="sf-canvas"></canvas>

      <div class="safari-hearts" id="sf-hearts"></div>
      <div class="safari-caption" id="sf-caption">❤️ Bon safari ❤️</div>
      <div class="safari-hint" id="sf-hint">Deplace ton doigt pour chercher</div>
    </div>
  `;

  const wrap = document.getElementById('sf-wrap');
  const canvas = document.getElementById('sf-canvas');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('sf-hint');
  const heartsLayer = document.getElementById('sf-hearts');
  const glowEl = document.getElementById('sf-heart-glow');

  let w = 0, h = 0, radius = 0, gap = 0;
  let targetX = 0, targetY = 0, curX = 0, curY = 0;
  let found = false;
  let raf = null;
  let heartInterval = null;

  function sizeAll(){
    const rect = wrap.getBoundingClientRect();
    w = rect.width; h = rect.height;
    canvas.width = w; canvas.height = h;
    radius = Math.min(w, h) * 0.185;
    gap = radius * 1.0;
    if(curX === 0 && curY === 0){
      targetX = curX = w * 0.32;
      targetY = curY = h * 0.28;
    }
  }
  sizeAll();
  window.addEventListener('resize', sizeAll);

  function drawFrame(){
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0a060f';
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'destination-out';
    [curX - gap / 2, curX + gap / 2].forEach(cx => {
      const grad = ctx.createRadialGradient(cx, curY, radius * 0.82, cx, curY, radius);
      grad.addColorStop(0, 'rgba(0,0,0,1)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, curY, radius, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalCompositeOperation = 'source-over';
    [curX - gap / 2, curX + gap / 2].forEach(cx => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, curY, radius, 0, Math.PI * 2);
      ctx.clip();
      const vign = ctx.createRadialGradient(cx, curY, radius * 0.55, cx, curY, radius);
      vign.addColorStop(0, 'rgba(0,0,0,0)');
      vign.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vign;
      ctx.fillRect(cx - radius, curY - radius, radius * 2, radius * 2);
      const glass = ctx.createRadialGradient(cx - radius * 0.3, curY - radius * 0.35, 0, cx - radius * 0.3, curY - radius * 0.35, radius * 0.7);
      glass.addColorStop(0, 'rgba(255,255,255,0.14)');
      glass.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = glass;
      ctx.fillRect(cx - radius, curY - radius, radius * 2, radius * 2);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, curY, radius, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, curY, radius + 2, 0, Math.PI * 2);
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, curY, radius, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - radius, curY);
      ctx.lineTo(cx + radius, curY);
      ctx.moveTo(cx, curY - radius);
      ctx.lineTo(cx, curY + radius);
      ctx.stroke();
      ctx.restore();
    });

    const bw = gap - radius * 0.15, bh = radius * 0.46;
    const bx = curX - bw / 2, by = curY - bh / 2;
    const bgrad = ctx.createLinearGradient(bx, by, bx, by + bh);
    bgrad.addColorStop(0, '#3a3040');
    bgrad.addColorStop(1, '#181420');
    ctx.fillStyle = bgrad;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 8) : ctx.rect(bx, by, bw, bh);
    ctx.fill();
  }

  function heartWorldPos(){
    return { x: HEART_PCT.x * w, y: HEART_PCT.y * h };
  }

  function loop(){
    curX += (targetX - curX) * 0.16;
    curY += (targetY - curY) * 0.16;
    drawFrame();

    if(!found){
      const hp = heartWorldPos();
      const dx = curX - hp.x, dy = curY - hp.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if(dist < radius * 0.55){
        found = true;
        onFound(hp);
      }
    }
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  function onMove(e){
    const rect = wrap.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    targetX = Math.max(0, Math.min(w, clientX - rect.left));
    targetY = Math.max(0, Math.min(h, clientY - rect.top));
    hint.classList.add('fading');
  }
  wrap.addEventListener('pointermove', onMove);
  wrap.addEventListener('mousemove', onMove);
  wrap.addEventListener('touchmove', onMove, { passive: true });

  function spawnHeart(x, y, opts){
    const el = document.createElement('div');
    el.className = 'sf-heart';
    el.textContent = opts.glyph || '❤';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (opts.size || 16) + 'px';
    el.style.color = opts.color || '#f4789a';
    heartsLayer.appendChild(el);
    return el;
  }

  function onFound(hp){
    hint.remove();
    wrap.classList.add('found');
    canvas.style.transition = 'opacity 0.7s ease';
    canvas.style.opacity = '0';
    if(glowEl) glowEl.style.opacity = '0';

    setTimeout(() => {
      // flash lumineux + petit zoom d'impact
      const flash = document.createElement('div');
      flash.className = 'sf-flash';
      wrap.appendChild(flash);
      requestAnimationFrame(() => { flash.style.opacity = '1'; });
      setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 500); }, 90);
      wrap.classList.add('punch');
      setTimeout(() => wrap.classList.remove('punch'), 420);

      function burstWave(count, speedMin, speedMax, sizeMin, sizeMax, delayStart){
        for(let i = 0; i < count; i++){
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
          const speed = speedMin + Math.random() * (speedMax - speedMin);
          const size = sizeMin + Math.random() * (sizeMax - sizeMin);
          const isSparkle = Math.random() < 0.28;
          const el = isSparkle
            ? spawnHeart(hp.x, hp.y, { size: size * 0.7, color: '#fff3d6', glyph: '✦' })
            : spawnHeart(hp.x, hp.y, { size, color: i % 2 ? '#f4789a' : '#ffb5c9' });
          let vx = Math.cos(angle) * speed;
          let vy = Math.sin(angle) * speed - 75;
          let x = hp.x, y = hp.y;
          const dur = 1400 + Math.random() * 700;
          const t0 = performance.now() + delayStart;
          function step(now){
            if(now < t0){ requestAnimationFrame(step); return; }
            const dt = 16 / 1000;
            const life = now - t0;
            vy += 92 * dt;
            x += vx * dt; y += vy * dt;
            const p = Math.min(1, life / dur);
            el.style.transform = `translate(${x - hp.x}px, ${y - hp.y}px) scale(${1 - p * 0.45}) rotate(${p * 200 * (i % 2 ? 1 : -1)}deg)`;
            el.style.opacity = String(1 - p);
            if(p < 1) requestAnimationFrame(step);
            else el.remove();
          }
          requestAnimationFrame(step);
        }
      }

      burstWave(30, 110, 210, 13, 20, 0);
      burstWave(16, 60, 130, 10, 15, 160);
      burstWave(10, 40, 90, 16, 24, 340);

      const captionEl = document.getElementById('sf-caption');
      setTimeout(() => { if(captionEl) captionEl.classList.add('show'); }, 950);

      heartInterval = setInterval(() => {
        const x = Math.random() * w;
        const size = 10 + Math.random() * 14;
        const el = spawnHeart(x, h + 20, { size, color: Math.random() > 0.5 ? '#f4789a' : '#ffd3de' });
        const sway = (Math.random() - 0.5) * 60;
        const dur = 3800 + Math.random() * 1600;
        const t0 = performance.now();
        function rise(now){
          const p = Math.min(1, (now - t0) / dur);
          const y = h + 20 - p * (h + 60);
          const x2 = x + Math.sin(p * Math.PI * 2) * sway;
          el.style.transform = `translate(${x2 - x}px, ${y - (h + 20)}px)`;
          el.style.opacity = String(p < 0.85 ? 1 : (1 - p) / 0.15);
          if(p < 1) requestAnimationFrame(rise);
          else el.remove();
        }
        requestAnimationFrame(rise);
      }, 260);
    }, 550);
  }

  dayCleanup = () => {
    cancelAnimationFrame(raf);
    clearInterval(heartInterval);
    window.removeEventListener('resize', sizeAll);
    wrap.removeEventListener('pointermove', onMove);
    wrap.removeEventListener('mousemove', onMove);
    wrap.removeEventListener('touchmove', onMove);
  };
}



/* ---------- MINI JEU RUNNER ---------- */
function initRunner(data, dayNum){
  const root = document.getElementById('runner-root');

  root.innerHTML = `
    <div class="runner-wrap" id="rn-wrap">
      <div class="runner-topbar">
        <div class="runner-progress"><div class="runner-progress-fill" id="rn-fill"></div></div>
        <div class="runner-lives" id="rn-lives">
          <span class="rn-life" data-i="0">❤</span>
          <span class="rn-life" data-i="1">❤</span>
          <span class="rn-life" data-i="2">❤</span>
        </div>
      </div>
      <canvas class="runner-canvas" id="rn-canvas"></canvas>
      <div class="runner-hint" id="rn-hint">Touche l'ecran pour sauter</div>
      <div class="runner-toast" id="rn-toast">On repart, courage 💪</div>
      <div class="runner-wintext" id="rn-wintext">${data.winText}</div>

      <div class="runner-start" id="rn-start">
        <div class="runner-start-title">Prete a me rejoindre ?</div>
        <button class="btn-restart" id="rn-launch-btn">Lancer ▶</button>
      </div>

      <div class="runner-intro" id="rn-intro">
        <div class="runner-intro-bubble" id="rn-intro-bubble">Viens me chercher !</div>
        <div class="runner-intro-avatar" id="rn-intro-avatar"></div>
      </div>
    </div>
  `;

  const wrap = document.getElementById('rn-wrap');
  const canvas = document.getElementById('rn-canvas');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('rn-hint');
  const fill = document.getElementById('rn-fill');
  const wintextEl = document.getElementById('rn-wintext');
  const livesEl = document.getElementById('rn-lives');
  const toastEl = document.getElementById('rn-toast');
  const startEl = document.getElementById('rn-start');
  const launchBtn = document.getElementById('rn-launch-btn');
  const introEl = document.getElementById('rn-intro');
  const introAvatar = document.getElementById('rn-intro-avatar');
  const introBubble = document.getElementById('rn-intro-bubble');

  introAvatar.style.backgroundImage = `url(${data.finishSprite || data.sprite})`;

  const sprite = new Image();
  sprite.src = data.sprite;
  const finishSprite = new Image();
  finishSprite.src = data.finishSprite || data.sprite;

  let w = 0, h = 0, groundY = 0;
  function sizeAll(){
    const rect = wrap.getBoundingClientRect();
    w = rect.width; h = rect.height;
    canvas.width = w; canvas.height = h;
    groundY = h * 0.82;
  }
  sizeAll();
  window.addEventListener('resize', sizeAll);

  const DISTANCE_TARGET = 5200;
  let distance = 0;
  let speed = 2.6;
  let finished = false;
  let started = false;
  let raf = null;
  let spawnTimer = 0;
  let heartTimer = 0;
  let lives = 3;
  let invincible = 0;

  const playerX = 0.22;
  const player = { y: 0, vy: 0, radius: 34, jumping: false, hurtFlash: 0, squash: 1 };

  const obstacles = [];
  const hearts = [];
  const collected = { count: 0 };

  function jump(){
    if(!started || finished) return;
    if(!player.jumping){
      player.vy = -12.5;
      player.jumping = true;
      hint.classList.add('fading');
    }
  }

  function spawnObstacle(){
    const size = 22 + Math.random() * 14;
    obstacles.push({ x: w + size, w: size, h: size, passed: false });
  }
  function spawnHeartCollectible(){
    hearts.push({ x: w + 20, y: groundY - 60 - Math.random() * 70, r: 12, taken: false });
  }

  function drawGround(){
    ctx.fillStyle = '#3c2716';
    ctx.fillRect(0, groundY, w, h - groundY);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(w, groundY);
    ctx.stroke();
    const off = (distance * 1.4) % 40;
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for(let x = -off; x < w; x += 40){
      ctx.fillRect(x, groundY + 8, 20, 4);
    }
  }

  function drawSky(){
    const grad = ctx.createLinearGradient(0, 0, 0, groundY);
    grad.addColorStop(0, '#2b1a3f');
    grad.addColorStop(0.5, '#8a4a63');
    grad.addColorStop(1, '#e39a63');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, groundY);
    const nearFinish = Math.max(0, Math.min(1, (distance - DISTANCE_TARGET * 0.78) / (DISTANCE_TARGET * 0.22)));
    const hillAmp = 40 * (1 - nearFinish);
    const hillOff = (distance * 0.3) % w;
    ctx.fillStyle = 'rgba(40,20,40,0.35)';
    for(let i = -1; i < 2; i++){
      const bx = i * w - hillOff;
      ctx.beginPath();
      ctx.ellipse(bx + w * 0.3, groundY, w * 0.5, hillAmp, 0, Math.PI, 0, true);
      ctx.fill();
    }
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(o.x, groundY - o.h / 2);
    ctx.fillStyle = '#1f1420';
    ctx.beginPath();
    ctx.ellipse(0, o.h * 0.15, o.w * 0.5, o.h * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, -o.h * 0.25, o.w * 0.32, o.h * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHeart(hObj){
    ctx.save();
    ctx.translate(hObj.x, hObj.y);
    ctx.font = (hObj.r * 2) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f4789a';
    ctx.fillText('❤', 0, 0);
    ctx.restore();
  }

  function drawCircleAvatar(img, cx, cy, radius, ringColor){
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy + radius + 6, radius * 0.9, radius * 0.25, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if(img.complete && img.naturalWidth){
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const targetSize = radius * 2.15;
      const scale = targetSize / Math.min(iw, ih);
      const dw = iw * scale, dh = ih * scale;
      ctx.drawImage(img, cx - dw / 2, cy - dh * 0.34, dw, dh);
    } else {
      ctx.fillStyle = '#f6dbe4';
      ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = ringColor;
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer(){
    const px = w * playerX;
    const py = groundY - player.radius - player.y;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(1 / player.squash, player.squash);
    const flashOn = invincible > 0 && Math.floor(invincible / 6) % 2 === 0;
    ctx.globalAlpha = flashOn ? 0.4 : 1;
    drawCircleAvatarLocal();
    ctx.restore();

    function drawCircleAvatarLocal(){
      ctx.beginPath();
      ctx.ellipse(0, player.radius + 6, player.radius * 0.9, player.radius * 0.25, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      if(sprite.complete && sprite.naturalWidth){
        const iw = sprite.naturalWidth, ih = sprite.naturalHeight;
        const targetSize = player.radius * 2.15;
        const scale = targetSize / Math.min(iw, ih);
        const dw = iw * scale, dh = ih * scale;
        ctx.drawImage(sprite, -dw / 2, -dh * 0.34, dw, dh);
      } else {
        ctx.fillStyle = '#f6dbe4';
        ctx.fillRect(-player.radius, -player.radius, player.radius * 2, player.radius * 2);
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = player.hurtFlash > 0 ? '#ff5c7a' : '#fff';
      ctx.stroke();
    }
  }

  function drawFinish(){
    if(distance < DISTANCE_TARGET - w) return;
    const fx = w * playerX + (DISTANCE_TARGET - distance) + w * 0.32;
    const pulse = 1 + 0.05 * Math.sin(performance.now() / 260);
    drawCircleAvatar(finishSprite, fx, groundY - 34, 30 * pulse, '#f4789a');
  }

  function updateLivesUI(){
    const nodes = livesEl.querySelectorAll('.rn-life');
    nodes.forEach((n, i) => {
      n.classList.toggle('lost', i >= lives);
    });
  }

  function showToast(){
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  function resetRun(){
    distance = 0;
    speed = 2.6;
    obstacles.length = 0;
    hearts.length = 0;
    lives = 3;
    invincible = 60;
    player.y = 0; player.vy = 0; player.jumping = false;
    updateLivesUI();
    showToast();
  }

  function update(dt){
    if(!started || finished) return;

    distance += speed * dt;
    if(speed < 4.2) speed += 0.0006 * dt;

    player.vy += 0.62 * dt;
    player.y -= player.vy * dt;
    if(player.y <= 0){
      player.y = 0;
      player.vy = 0;
      if(player.jumping){ player.jumping = false; player.squash = 1.2; }
    }
    player.squash += (1 - player.squash) * 0.2;

    if(player.hurtFlash > 0) player.hurtFlash -= dt;
    if(invincible > 0) invincible -= dt;

    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = 55 + Math.random() * 45;
    }
    heartTimer -= dt;
    if(heartTimer <= 0){
      spawnHeartCollectible();
      heartTimer = 60 + Math.random() * 50;
    }

    const px = w * playerX;
    for(let i = obstacles.length - 1; i >= 0; i--){
      const o = obstacles[i];
      o.x -= speed * dt;
      const py = groundY - player.radius - player.y;
      const dx = px - o.x, dy = py - (groundY - o.h / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      if(!o.passed && invincible <= 0 && dist < player.radius * 0.85 + o.w * 0.4){
        o.passed = true;
        player.hurtFlash = 18;
        invincible = 70;
        lives--;
        updateLivesUI();
        wrap.classList.add('shake');
        setTimeout(() => wrap.classList.remove('shake'), 220);
        if(lives <= 0){
          resetRun();
        }
      }
      if(o.x < -60) obstacles.splice(i, 1);
    }

    for(let i = hearts.length - 1; i >= 0; i--){
      const hObj = hearts[i];
      hObj.x -= speed * dt;
      const py = groundY - player.radius - player.y;
      const dx = px - hObj.x, dy = py - hObj.y;
      if(!hObj.taken && Math.sqrt(dx * dx + dy * dy) < player.radius + hObj.r){
        hObj.taken = true;
        collected.count++;
      }
      if(hObj.taken || hObj.x < -40) hearts.splice(i, 1);
    }

    const pct = Math.min(1, distance / DISTANCE_TARGET);
    fill.style.width = (pct * 100) + '%';

    if(distance >= DISTANCE_TARGET){
      finish();
    }
  }

  function render(){
    ctx.clearRect(0, 0, w, h);
    drawSky();
    drawGround();
    drawFinish();
    obstacles.forEach(drawObstacle);
    hearts.filter(hh => !hh.taken).forEach(drawHeart);
    drawPlayer();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(2.4, (now - last) / 16.6);
    last = now;
    update(dt);
    render();
    raf = requestAnimationFrame(loop);
  }

  function finish(){
    finished = true;
    hint.remove();
    wrap.classList.add('finished');
    setTimeout(() => { wintextEl.classList.add('show'); }, 500);
  }

  function onInput(e){
    if(e.type === 'keydown' && e.code !== 'Space') return;
    e.preventDefault && e.preventDefault();
    jump();
  }
  wrap.addEventListener('pointerdown', onInput);
  window.addEventListener('keydown', onInput);

  function beginGame(){
    started = true;
    updateLivesUI();
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function playIntroThenStart(){
    startEl.classList.add('hidden');
    introEl.classList.add('show');
    requestAnimationFrame(() => {
      introAvatar.classList.add('enter');
    });
    setTimeout(() => { introBubble.classList.add('show'); }, 900);
    setTimeout(() => { introBubble.classList.remove('show'); }, 2500);
    setTimeout(() => {
      introEl.classList.add('leaving');
      setTimeout(() => {
        introEl.remove();
        render();
        beginGame();
      }, 500);
    }, 2900);
  }

  launchBtn.addEventListener('click', () => {
    startEl.classList.add('leaving');
    setTimeout(() => playIntroThenStart(), 350);
  }, { once: true });

  render();

  dayCleanup = () => {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', sizeAll);
    wrap.removeEventListener('pointerdown', onInput);
    window.removeEventListener('keydown', onInput);
  };
}



/* ---------- COFFRE FORT ---------- */
function initSafe(data, dayNum){
  const root = document.getElementById('safe-root');
  const codeDigits = data.code.split('').map(Number);
  const ITEM_H = 40;
  const RANGE = 24;

  function buildWheelCells(){
    let html = '';
    for(let i = -RANGE; i <= RANGE; i++){
      const d = ((i % 10) + 10) % 10;
      html += `<div class="safe-cell" style="transform:translateY(${i * ITEM_H}px)">${d}</div>`;
    }
    return html;
  }

  root.innerHTML = `
    <div class="safe-wrap" id="sf2-wrap">
      <div class="safe-interior" id="sf2-interior">
        <div class="safe-rays" id="sf2-rays"></div>
        <div class="safe-glow"></div>
        <div class="safe-wintext" id="sf2-wintext">${data.winText}</div>
      </div>
      <div class="safe-door" id="sf2-door">
        <div class="safe-hinge safe-hinge-top"></div>
        <div class="safe-hinge safe-hinge-bottom"></div>
        <div class="safe-dial-plate">
          <div class="safe-wheels" id="sf2-wheels">
            ${[0, 1, 2, 3].map(i => `
              <div class="safe-wheel-window">
                <div class="safe-wheel" id="sf2-wheel-${i}" data-pos="0">${buildWheelCells()}</div>
              </div>
            `).join('')}
          </div>
          <div class="safe-dial-hint">Fais glisser chaque molette</div>
          <div class="safe-wheel-handle" id="sf2-handle">
            <div class="safe-wheel-handle-spokes"></div>
            <div class="safe-wheel-handle-hub"></div>
          </div>
        </div>
      </div>
    </div>
  `;

  const wrap = document.getElementById('sf2-wrap');
  const door = document.getElementById('sf2-door');
  const wintextEl = document.getElementById('sf2-wintext');
  let unlocked = false;

  const wheels = [0, 1, 2, 3].map(i => {
    const el = document.getElementById(`sf2-wheel-${i}`);
    return { el, pos: 0, dragging: false, startY: 0, startPos: 0 };
  });

  function applyWheel(wh){
    wh.el.style.transform = `translateY(${-wh.pos * ITEM_H}px)`;
  }

  function currentDigit(wh){
    return ((Math.round(wh.pos) % 10) + 10) % 10;
  }

  function checkCombo(){
    if(unlocked) return;
    const allSettled = wheels.every(wh => !wh.dragging && Math.abs(wh.pos - Math.round(wh.pos)) < 0.01);
    if(!allSettled) return;
    const ok = wheels.every((wh, i) => currentDigit(wh) === codeDigits[i]);
    if(ok) unlock();
  }

  function onDown(wh){
    return (e) => {
      wh.dragging = true;
      wh.startY = e.touches ? e.touches[0].clientY : e.clientY;
      wh.startPos = wh.pos;
      wh.el.style.transition = 'none';
    };
  }
  function onMove(wh){
    return (e) => {
      if(!wh.dragging) return;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dy = clientY - wh.startY;
      wh.pos = wh.startPos + dy / ITEM_H;
      applyWheel(wh);
    };
  }
  function onUp(wh){
    return () => {
      if(!wh.dragging) return;
      wh.dragging = false;
      wh.pos = Math.round(wh.pos);
      wh.el.style.transition = 'transform 0.2s ease';
      applyWheel(wh);
      setTimeout(checkCombo, 220);
    };
  }

  const listeners = [];
  wheels.forEach(wh => {
    const win = wh.el.closest('.safe-wheel-window');
    const down = onDown(wh), move = onMove(wh), up = onUp(wh);
    win.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    win.addEventListener('touchstart', down, { passive: true });
    window.addEventListener('touchmove', move, { passive: true });
    window.addEventListener('touchend', up);
    listeners.push({ win, down, move, up });
  });

  function unlock(){
    unlocked = true;
    const handle = document.getElementById('sf2-handle');
    const rays = document.getElementById('sf2-rays');
    wrap.classList.add('unlocking');
    if(handle) handle.classList.add('spin');
    setTimeout(() => {
      wrap.classList.add('clicked');
      setTimeout(() => {
        door.classList.add('open');
        if(rays) rays.classList.add('show');
        setTimeout(() => { wintextEl.classList.add('show'); }, 650);
      }, 180);
    }, 700);
  }

  dayCleanup = () => {
    listeners.forEach(({ win, down, move, up }) => {
      win.removeEventListener('pointerdown', down);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      win.removeEventListener('touchstart', down);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    });
  };
}

  const wrap = document.getElementById('gf-wrap');
  const sun = document.getElementById('gf-sun');
  const fillEl = document.getElementById('gf-fill');
  const hint = document.getElementById('gf-hint');
  const wintextEl = document.getElementById('gf-wintext');
  const stem = document.getElementById('gf-stem');
  const leafLeft = document.getElementById('gf-leaf-left');
  const leafRight = document.getElementById('gf-leaf-right');
  const flowerGroup = document.getElementById('gf-flower');
  const petals = document.getElementById('gf-petals');
  const petalEls = Array.from(document.querySelectorAll('.gf-petal'));
  const centerEl = document.getElementById('gf-center');

  const stemLen = stem.getTotalLength();
  stem.style.strokeDasharray = String(stemLen);
  stem.style.strokeDashoffset = String(stemLen);
  flowerGroup.style.opacity = '0';

  let taps = 0;
  let done = false;

  function update(){
    const pct = Math.min(1, taps / TAP_TARGET);
    fillEl.style.width = (pct * 100) + '%';
    stem.style.strokeDashoffset = String(stemLen * (1 - pct));

    leafLeft.style.opacity = pct > 0.3 ? '1' : '0';
    leafLeft.style.transform = pct > 0.3 ? 'scale(1)' : 'scale(0.2)';
    leafRight.style.opacity = pct > 0.5 ? '1' : '0';
    leafRight.style.transform = pct > 0.5 ? 'scale(1)' : 'scale(0.2)';

    // la fleur suit exactement la pointe reelle de la tige (evite tout decalage)
    const tip = stem.getPointAtLength(stemLen * pct);
    const budScale = 0.6 + pct * 0.5;
    flowerGroup.style.opacity = pct > 0.04 ? '1' : '0';
    flowerGroup.setAttribute('transform', `translate(${tip.x},${tip.y}) scale(${budScale})`);

    // le centre apparait tot, discret
    centerEl.style.opacity = pct > 0.04 ? '1' : '0';

    // les petales apparaissent un par un au fil des taps (a partir de 15% de progression)
    const petalStart = 0.15;
    const petalRange = 1 - petalStart;
    petalEls.forEach((p, i) => {
      const threshold = petalStart + (i / petalEls.length) * petalRange;
      p.classList.toggle('shown', pct >= threshold);
    });

    if(pct >= 1 && !done){
      done = true;
      bloom();
    }
  }

  function bloom(){
    wrap.classList.add('bloomed');
    petals.classList.add('open');
    hint.remove();
    sun.classList.add('resting');
    setTimeout(() => { wintextEl.classList.add('show'); }, 900);
  }

  function onTap(){
    if(done) return;
    taps++;
    hint.classList.add('fading');
    sun.classList.remove('bounce');
    void sun.offsetWidth;
    sun.classList.add('bounce');
    spawnSparkle();
    update();
  }

  function spawnSparkle(){
    const rect = sun.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    for(let i = 0; i < 3; i++){
      const s = document.createElement('div');
      s.className = 'gf-sparkle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 24;
      s.style.left = (rect.left - wrapRect.left + rect.width / 2) + 'px';
      s.style.top = (rect.top - wrapRect.top + rect.height / 2) + 'px';
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      wrap.appendChild(s);
      setTimeout(() => s.remove(), 700);
    }
  }

  sun.addEventListener('click', onTap);
  update();

  dayCleanup = () => {
    sun.removeEventListener('click', onTap);
  };
}


/* ---------- CHAT ET PELOTE ---------- */
function initYarnCat(data, dayNum){
  const root = document.getElementById('yarncat-root');
  const TAP_TARGET = 12;

  function heartWaypoints(n, cx, cy, scale){
    const pts = [];
    for(let i = 0; i < n; i++){
      const t = (2 * Math.PI * i) / (n - 1);
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      pts.push({ x: cx + x * scale, y: cy - y * scale });
    }
    return pts;
  }
  const WP = heartWaypoints(40, 150, 195, 8.2);
  const pathD = 'M' + WP.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L') + ' Z';

  root.innerHTML = `
    <div class="yc-wrap" id="yc-wrap">
      <svg class="yc-scene" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="yc-floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff6ea"/>
            <stop offset="100%" stop-color="#f6dbe4"/>
          </linearGradient>
        </defs>
        <rect width="300" height="400" fill="url(#yc-floor)"/>
        <path id="yc-thread" d="${pathD}" fill="none" stroke="#e05c88" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0"/>
        <text id="yc-cat" x="34" y="335" font-size="50">🐱</text>
      </svg>
      <div class="yc-ball" id="yc-ball">🧶</div>
      <div class="yc-counter" id="yc-counter">${TAP_TARGET}</div>
      <div class="yc-hint" id="yc-hint">Touche la pelote</div>
      <div class="yc-wintext-overlay" id="yc-wintext-overlay">
        <div class="yc-wintext" id="yc-wintext">${data.winText}</div>
      </div>
    </div>
  `;

  const wrap = document.getElementById('yc-wrap');
  const ball = document.getElementById('yc-ball');
  const thread = document.getElementById('yc-thread');
  const cat = document.getElementById('yc-cat');
  const hint = document.getElementById('yc-hint');
  const wintextEl = document.getElementById('yc-wintext');
  const counterEl = document.getElementById('yc-counter');

  const threadLen = thread.getTotalLength();
  thread.style.strokeDasharray = String(threadLen);
  thread.style.strokeDashoffset = String(threadLen);

  let w = 0, h = 0;
  function sizeAll(){
    const rect = wrap.getBoundingClientRect();
    w = rect.width; h = rect.height;
  }
  sizeAll();
  window.addEventListener('resize', sizeAll);

  let taps = 0;
  let done = false;
  let moving = false;

  function placeBallRandom(){
    // evite le coin en bas a gauche ou se trouve le chat
    const marginX = w * 0.14, marginY = h * 0.12;
    let x, y;
    do {
      x = marginX + Math.random() * (w - marginX * 2);
      y = marginY + Math.random() * (h - marginY * 2 - h * 0.15);
    } while(x < w * 0.28 && y > h * 0.68);
    ball.style.left = x + 'px';
    ball.style.top = y + 'px';
  }
  placeBallRandom();

  function catReact(){
    cat.classList.remove('yc-react');
    void cat.getBBox();
    cat.classList.add('yc-react');
  }

  function onTap(){
    if(done || moving) return;
    taps++;
    hint.classList.add('fading');
    catReact();

    if(taps >= TAP_TARGET){
      finish();
      return;
    }

    moving = true;
    ball.classList.add('yc-caught');
    setTimeout(() => {
      ball.classList.remove('yc-caught');
      placeBallRandom();
      moving = false;
    }, 260);
  }

  function finish(){
    done = true;
    ball.classList.add('yc-gone');
    setTimeout(() => {
      thread.style.transition = 'opacity 0.3s ease';
      thread.style.opacity = '1';
      thread.style.transition += ', stroke-dashoffset 1.3s cubic-bezier(.3,.6,.25,1)';
      requestAnimationFrame(() => { thread.style.strokeDashoffset = '0'; });
      cat.classList.add('yc-happy');
      wrap.classList.add('done');
      setTimeout(() => { wintextEl.classList.add('show'); }, 1500);
    }, 350);
  }

  ball.addEventListener('click', onTap);

  dayCleanup = () => {
    window.removeEventListener('resize', sizeAll);
    ball.removeEventListener('click', onTap);
  };
}

        max-width: 62px;
        aspect-ratio: 0.82 / 1;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        animation: bln-float 3.6s ease-in-out infinite;

        dominant-baseline: middle;
      }

        border-radius: 2px;
        opacity: 1;
        will-change: transform, opacity;
      }

      #balloons-root .bln-center-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 3;
      }

      #balloons-root .bln-word {
        display: flex;

        color: var(--accent, #d98ba8);
        letter-spacing: 0.08em;
        margin-bottom: 12px;
        font-weight: 600;
      }

      #balloons-root .bln-overlay-text {
        font-family: var(--serif, 'Fraunces', serif);
        font-size: 1rem;
        line-height: 1.55;
        color: var(--ink, #4a3b42);
      }
    </style>

    <div class="bln-scene">
      <div class="bln-hint" id="bln-hint-${dayNum}">Touche les ballons</div>

      <div class="bln-center-wrap">
        <div class="bln-word" id="bln-word-${dayNum}"></div>

  const rowEl = root.querySelector(`#bln-row-${dayNum}`);
  const hintEl = root.querySelector(`#bln-hint-${dayNum}`);
  const wordEl = root.querySelector(`#bln-word-${dayNum}`);
  const overlayEl = root.querySelector(`#bln-overlay-${dayNum}`);
  const sceneEl = root.querySelector('.bln-scene');

  const letterSlots = [];
  letters.forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'bln-word-letter';
    span.textContent = ch;
    wordEl.appendChild(span);
    letterSlots.push(span);
  });

  letters.forEach((ch, i) => {
    const color = colors[i % colors.length];
    const balloon = document.createElement('div');
    balloon.className = 'balloon';
    balloon.style.animationDelay = (i * 0.25) + 's';
    balloon.dataset.index = i;

    balloon.innerHTML = `
      <svg viewBox="0 0 100 130">
        <ellipse cx="50" cy="46" rx="42" ry="46" fill="${color}"></ellipse>
        <ellipse cx="36" cy="28" rx="10" ry="14" fill="rgba(255,255,255,0.35)"></ellipse>

        <line x1="50" y1="102" x2="50" y2="128" stroke="${color}" stroke-width="1.5" opacity="0.6"></line>
        <text x="50" y="48" font-size="34" class="balloon-letter">${ch}</text>
      </svg>
    `;

    const handlePop = (e) => {
      e.preventDefault();
      if (balloon.classList.contains('popped')) return;
      popBalloon(balloon, i, color);
    };

    balloon.addEventListener('click', handlePop);
    balloon.addEventListener('touchstart', handlePop, { passive: false });

    rowEl.appendChild(balloon);
  });

  function markInteracted() {
    if (hasInteracted) return;
    hasInteracted = true;
    hintEl.classList.add('hidden');
  }

  function popBalloon(balloon, index, color) {
    markInteracted();
    balloon.classList.add('popped');

    const rect = balloon.getBoundingClientRect();
    const sceneRect = sceneEl.getBoundingClientRect();
    const cx = rect.left - sceneRect.left + rect.width / 2;
    const cy = rect.top - sceneRect.top + rect.height / 2;

    spawnFragments(cx, cy, color);

    balloon.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
    balloon.style.transform = 'scale(1.15)';
    balloon.style.opacity = '0';
    setTimeout(() => { balloon.style.display = 'none'; }, 160);

    letterSlots[index].classList.add('show');

    poppedCount++;
    if (poppedCount === letters.length) {
      setTimeout(showFinalOverlay, 700);
    }
  }

  function spawnFragments(cx, cy, color) {
    const fragCount = 10;
    for (let i = 0; i < fragCount; i++) {
      const frag = document.createElement('div');
      frag.className = 'bln-pop-frag';
      const size = 4 + Math.random() * 5;
      frag.style.width = size + 'px';
      frag.style.height = size + 'px';
      frag.style.left = cx + 'px';
      frag.style.top = cy + 'px';
      frag.style.background = color;

      const angle = (Math.PI * 2 * i) / fragCount + Math.random() * 0.5;
      const dist = 30 + Math.random() * 40;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const rot = Math.random() * 360;

      sceneEl.appendChild(frag);

      frag.animate([
        { transform: 'translate(-50%,-50%) translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
      ], {
        duration: 550 + Math.random() * 200,
        easing: 'cubic-bezier(.2,.7,.3,1)',
        fill: 'forwards'
      });

      setTimeout(() => frag.remove(), 800);
    }
  }

  function showFinalOverlay() {
    overlayEl.classList.add('show');
  }

  dayCleanup = () => {
    root.innerHTML = '';
  };
}

          <path class="cf-flame cf-flame-mid" d="M80,205 C55,190 50,160 65,130 C58,138 55,115 68,95 C72,112 80,108 82,90 C92,108 96,92 90,72 C108,88 112,118 98,138 C112,132 112,155 98,168 C104,176 98,196 80,205 Z"/>
          <path class="cf-flame cf-flame-inner" d="M80,198 C68,188 66,168 76,150 C72,155 70,140 78,128 C80,138 85,135 86,124 C93,136 95,124 91,112 C102,122 104,142 96,155 C104,150 104,165 96,174 C99,180 94,193 80,198 Z"/>

  function escapeHtmlCf(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const fill = root.querySelector('.cf-progress-fill');
  const overlay = root.querySelector('.cf-overlay');
  const sparkGroup = root.querySelector('.cf-spark-group');

  function spawnSpark(clientX, clientY) {
    const svgRect = root.querySelector('.cf-flame-svg').getBoundingClientRect();
    let cx = 80, cy = 150;
    if (clientX != null && svgRect.width) {
      const relX = (clientX - svgRect.left) / svgRect.width;
      const relY = (clientY - svgRect.top) / svgRect.height;
      cx = Math.min(Math.max(relX * 160, 20), 140);
      cy = Math.min(Math.max(relY * 220, 40), 190);
    }
    const NS = 'http://www.w3.org/2000/svg';
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', (Math.random() * 2 + 1.5).toFixed(1));
    dot.setAttribute('class', 'cf-spark');
    dot.style.setProperty('--dx', `${(Math.random() * 40 - 20).toFixed(0)}px`);
    dot.style.setProperty('--dy', `${-(Math.random() * 60 + 30).toFixed(0)}px`);
    sparkGroup.appendChild(dot);
    setTimeout(() => dot.remove(), 900);
  }

  function updateStage() {
    scene.setAttribute('data-stage', String(step));
    fill.style.width = `${(step / TOTAL_STEPS) * 100}%`;
  }

  function handleInteraction(e) {
    if (finished) return;

    if (!firstInteraction) {
      firstInteraction = true;
      hint.classList.add('cf-hint-hidden');
    }

    let x, y;
    if (e.changedTouches && e.changedTouches.length) {
      x = e.changedTouches[0].clientX;
      y = e.changedTouches[0].clientY;
    } else {
      x = e.clientX;
      y = e.clientY;
    }

    for (let i = 0; i < 3; i++) {
      setTimeout(() => spawnSpark(x, y), i * 60);
    }

    step = Math.min(step + 1, TOTAL_STEPS);
    updateStage();

    if (step >= TOTAL_STEPS && !finished) {
      finished = true;
      setTimeout(() => {
        overlay.classList.add('cf-overlay-visible');
      }, 700);
    }
  }

  scene.addEventListener('pointerdown', handleInteraction);
  updateStage();

  dayCleanup = () => {
    scene.removeEventListener('pointerdown', handleInteraction);
  };
}


/* ---------- COQUILLAGES ---------- */
function initSeashells(data, dayNum) {
  const root = document.getElementById('seashells-root');
  root.innerHTML = '';

  const SHELL_WORDS = [
    "toi", "nous", "ici", "encore", "toujours",
    "doucement", "pres de toi", "ce jour-la", "en secret", "pour de vrai"
  ];
  const TOTAL_SHELLS = 8;

  const container = document.createElement('div');
  container.className = 'sh-scene';
  container.innerHTML = `
    <div class="sh-sky"></div>
    <div class="sh-sand-zone">
      <svg class="sh-sand-svg" viewBox="0 0 300 400" preserveAspectRatio="none">
        <path d="M0,60 Q150,20 300,60 L300,400 L0,400 Z" fill="var(--sh-sand)"></path>
      </svg>
      <div class="sh-shells-layer"></div>
    </div>
    <div class="sh-water-zone" role="button" tabindex="0" aria-label="Toucher l'eau">
      <svg class="sh-water-svg" viewBox="0 0 300 120" preserveAspectRatio="none">
        <path class="sh-water-base" d="M0,40 Q75,10 150,40 T300,40 L300,120 L0,120 Z"></path>
      </svg>
      <div class="sh-waves-layer"></div>
    </div>
    <p class="sh-hint">Touche l'eau</p>
    <div class="sh-overlay">
      <div class="sh-overlay-card">
        <p class="sh-overlay-text"></p>
      </div>
    </div>
  `;
  root.appendChild(container);

  const waterZone = container.querySelector('.sh-water-zone');
  const wavesLayer = container.querySelector('.sh-waves-layer');
  const shellsLayer = container.querySelector('.sh-shells-layer');
  const hint = container.querySelector('.sh-hint');
  const overlay = container.querySelector('.sh-overlay');
  const overlayText = container.querySelector('.sh-overlay-text');

  let shellCount = 0;
  let firstInteraction = false;
  let busy = false;
  const usedPositions = [];
  const usedWordIndices = [];
  const timeouts = [];

  function safeTimeout(fn, ms) {
    const id = setTimeout(fn, ms);
    timeouts.push(id);
    return id;
  }

  function pickPosition() {
    let x, y, tries = 0;
    do {
      x = 12 + Math.random() * 76;
      y = 15 + Math.random() * 70;
      tries++;
    } while (
      usedPositions.some(p => Math.hypot(p.x - x, p.y - y) < 18) &&
      tries < 30
    );
    usedPositions.push({ x, y });
    return { x, y };
  }

  function pickWordIndex() {
    if (usedWordIndices.length >= SHELL_WORDS.length) return -1;
    let idx;
    do {
      idx = Math.floor(Math.random() * SHELL_WORDS.length);
    } while (usedWordIndices.includes(idx));
    usedWordIndices.push(idx);
    return idx;
  }

  function shellSVG(variant) {
    const shapes = [
      `<path d="M12 2 C5 6 2 14 12 22 C22 14 19 6 12 2 Z" />`,
      `<path d="M12 3 C4 8 3 16 12 21 C21 16 20 8 12 3 Z" />`,
      `<circle cx="12" cy="12" r="9" />`
    ];
    return shapes[variant % shapes.length];
  }

  function spawnWave(onLand) {
    const wave = document.createElement('div');
    wave.className = 'sh-wave';
    wave.innerHTML = `
      <svg viewBox="0 0 300 60" preserveAspectRatio="none">
        <path d="M0,30 Q75,0 150,30 T300,30 L300,60 L0,60 Z"></path>
      </svg>
    `;
    wavesLayer.appendChild(wave);
    requestAnimationFrame(() => wave.classList.add('sh-wave-active'));
    wave.addEventListener('animationend', () => {
      wave.remove();
      if (onLand) onLand();
    }, { once: true });
  }

  function dropShell() {
    if (shellCount >= TOTAL_SHELLS) return;
    const pos = pickPosition();
    const hasWord = Math.random() < 0.7;
    const wordIdx = hasWord ? pickWordIndex() : -1;
    const word = wordIdx >= 0 ? SHELL_WORDS[wordIdx] : null;
    const variant = shellCount;
    const rotation = (Math.random() * 40 - 20).toFixed(1);

    const shell = document.createElement('div');
    shell.className = 'sh-shell';
    shell.style.left = pos.x + '%';
    shell.style.top = pos.y + '%';
    shell.style.setProperty('--sh-rot', rotation + 'deg');

    shell.innerHTML = `
      <div class="sh-shell-inner">
        <svg class="sh-shell-front" viewBox="0 0 24 24">${shellSVG(variant)}</svg>
        <div class="sh-shell-back">${word ? `<span>${word}</span>` : `<span class="sh-shell-dot">✦</span>`}</div>
      </div>
    `;
    shellsLayer.appendChild(shell);

    requestAnimationFrame(() => shell.classList.add('sh-shell-show'));

    if (word) {
      shell.style.cursor = 'pointer';
      shell.addEventListener('click', (e) => {
        e.stopPropagation();
        shell.classList.toggle('sh-shell-flipped');
      });
    }

    shellCount++;
    if (shellCount >= TOTAL_SHELLS) {
      safeTimeout(showFinalMessage, 900);
    }
  }

  function showFinalMessage() {
    overlayText.textContent = '';
    overlay.classList.add('sh-overlay-visible');
    const full = data.winText || '';
    let i = 0;
    function typeChar() {
      if (i <= full.length) {
        overlayText.textContent = full.slice(0, i);
        i++;
        safeTimeout(typeChar, 28);
      }
    }
    typeChar();
  }

  function handleInteraction(e) {
    if (busy || shellCount >= TOTAL_SHELLS) return;
    busy = true;

    if (!firstInteraction) {
      firstInteraction = true;
      hint.classList.add('sh-hint-hidden');
    }

    spawnWave(() => {
      dropShell();
      busy = false;
    });
  }

  waterZone.addEventListener('click', handleInteraction);
  waterZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInteraction(e);
  }, { passive: false });

  dayCleanup = function () {
    timeouts.forEach(clearTimeout);
    waterZone.removeEventListener('click', handleInteraction);
  };
}

function initSnowglobe(data, dayNum) {
  const root = document.getElementById('snowglobe-root');

  root.innerHTML = `
    <div class="sg-container">
      <div class="sg-stage">
        <div class="sg-globe" id="sg-globe-${dayNum}">

            <svg class="sg-scene" viewBox="0 0 200 200" preserveAspectRatio="xMidYMax slice">

              <circle cx="65" cy="150" r="20" fill="#4a3b42"/>

              <circle cx="135" cy="150" r="20" fill="#d98ba8"/>
              <path d="M135 150 Q140 120 130 100" stroke="#d98ba8" stroke-width="7" fill="none" stroke-linecap="round"/>
              <path d="M85 128 Q100 138 115 128" stroke="#4a3b42" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
              <g opacity="0.55">
                <circle cx="30" cy="110" r="8" fill="#ffffff"/>
                <rect x="27" y="118" width="6" height="30" fill="#e9c9a3"/>
                <circle cx="170" cy="100" r="10" fill="#ffffff"/>
                <rect x="166" y="110" width="8" height="40" fill="#e9c9a3"/>
              </g>
            </svg>
            <div class="sg-flakes-layer" id="sg-flakes-${dayNum}"></div>
          </div>
          <div class="sg-shine"></div>
        </div>
        <div class="sg-base"></div>
        <p class="sg-hint" id="sg-hint-${dayNum}">Secoue la boule</p>
      </div>
      <div class="sg-message" id="sg-message-${dayNum}">
        <p>${data.winText}</p>
      </div>
    </div>
  `;

  const globe = root.querySelector(`#sg-globe-${dayNum}`);
  const flakesLayer = root.querySelector(`#sg-flakes-${dayNum}`);
  const hint = root.querySelector(`#sg-hint-${dayNum}`);
  const messageEl = root.querySelector(`#sg-message-${dayNum}`);

  let shakeCount = 0;
  let hasWon = false;
  let hintHidden = false;
  let flakes = [];
  let animId = null;
  let running = false;

  let dragging = false;
  let lastX = 0, lastY = 0, lastT = 0;
  let velocityBuffer = [];
  let directionChanges = 0;
  let lastDir = 0;

  let tapTimes = [];

  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hint.classList.add('sg-hint--hidden');
  }

  function spawnFlakes(count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'sg-flake';
      const size = 3 + Math.random() * 5;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      const startX = 20 + Math.random() * 160;
      const flake = {
        el,
        x: startX,
        y: 20 + Math.random() * 60,
        vx: (Math.random() - 0.5) * 1.6,
        vy: Math.random() * 0.6,
        swayPhase: Math.random() * Math.PI * 2,
        swaySpeed: 0.02 + Math.random() * 0.03,
        opacity: 0.7 + Math.random() * 0.3,
        settled: false
      };
      el.style.opacity = flake.opacity;
      flakesLayer.appendChild(el);
      flakes.push(flake);
    }
    if (flakes.length > 140) {
      const excess = flakes.splice(0, flakes.length - 140);
      excess.forEach(f => f.el.remove());
    }
    if (!running) {
      running = true;
      animId = requestAnimationFrame(tick);
    }
  }

  function tick() {
    flakes.forEach(f => {
      if (f.settled) return;
      f.swayPhase += f.swaySpeed;
      f.x += f.vx * 0.4 + Math.sin(f.swayPhase) * 0.3;
      f.vy += 0.012;
      if (f.vy > 1.2) f.vy = 1.2;
      f.y += f.vy;
      f.vx *= 0.99;

      if (f.x < 8) f.x = 8;
      if (f.x > 192) f.x = 192;

      if (f.y >= 178) {
        f.y = 178;
        f.settled = true;
        f.el.style.opacity = f.opacity * 0.5;
      }

      f.el.style.transform = `translate(${f.x}px, ${f.y}px)`;
    });

    running = flakes.some(f => !f.settled) || flakes.length > 0;
    if (flakes.length > 0) {
      animId = requestAnimationFrame(tick);
    } else {
      running = false;
    }
  }

  function registerShake() {
    hideHint();
    spawnFlakes(28 + Math.floor(Math.random() * 12));
    shakeCount++;
    globe.classList.remove('sg-globe--pulse');
    void globe.offsetWidth;
    globe.classList.add('sg-globe--pulse');

    if (shakeCount >= 2 && !hasWon) {
      hasWon = true;
      setTimeout(() => {
        messageEl.classList.add('sg-message--visible');
      }, 700);
    }
  }

  function onPointerDown(e) {
    dragging = true;
    const p = getPoint(e);
    lastX = p.x; lastY = p.y; lastT = performance.now();
    velocityBuffer = [];
    directionChanges = 0;
    lastDir = 0;

    const now = performance.now();
    tapTimes.push(now);
    tapTimes = tapTimes.filter(t => now - t < 1200);
    if (tapTimes.length >= 4) {
      tapTimes = [];
      registerShake();
    }
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const p = getPoint(e);
    const now = performance.now();
    const dt = Math.max(now - lastT, 1);
    const dx = p.x - lastX;
    const speed = Math.abs(dx) / dt;

    const dir = dx > 0 ? 1 : (dx < 0 ? -1 : lastDir);
    if (lastDir !== 0 && dir !== lastDir && speed > 0.35) {
      directionChanges++;
    }
    lastDir = dir;

    velocityBuffer.push(speed);
    if (velocityBuffer.length > 10) velocityBuffer.shift();

    if (directionChanges >= 3) {
      directionChanges = 0;
      registerShake();
    }

    lastX = p.x; lastY = p.y; lastT = now;
  }

  function onPointerUp() {
    dragging = false;
    directionChanges = 0;
    lastDir = 0;
  }

  function getPoint(e) {
    if (e.touches && e.touches[0]) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  globe.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  globe.addEventListener('touchstart', onPointerDown, { passive: true });
  window.addEventListener('touchmove', onPointerMove, { passive: true });
  window.addEventListener('touchend', onPointerUp);

  dayCleanup = function () {
    globe.removeEventListener('pointerdown', onPointerDown);
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    globe.removeEventListener('touchstart', onPointerDown);
    window.removeEventListener('touchmove', onPointerMove);
    window.removeEventListener('touchend', onPointerUp);
    if (animId) cancelAnimationFrame(animId);
    flakes.forEach(f => f.el.remove());
    flakes = [];
  };
}

/* ---------- MACHINE A SOUS ---------- */
function initSlotMachine(data, dayNum){
  const root = document.getElementById('slotmachine-root');
  const combos = data.combos;
  const fillers = data.fillerSymbols || [];
  const winRate = data.winRate != null ? data.winRate : 0.8;
  const allSymbols = combos.map(c => c.symbol).concat(fillers);

  root.innerHTML = `
    <div class="slot-wrap">
      <div class="slot-machine">
        <div class="slot-reels">
          <div class="slot-reel" id="slot-r0">🍀</div>
          <div class="slot-reel" id="slot-r1">🍀</div>
          <div class="slot-reel" id="slot-r2">🍀</div>
        </div>
      </div>
      <button class="slot-btn" id="slot-btn">Lancer 🎰</button>
      <div class="slot-result" id="slot-result"></div>
    </div>
  `;

  const reels = [
    document.getElementById('slot-r0'),
    document.getElementById('slot-r1'),
    document.getElementById('slot-r2')
  ];
  const btn = document.getElementById('slot-btn');
  const resultEl = document.getElementById('slot-result');

  function randSymbol(){
    return allSymbols[Math.floor(Math.random() * allSymbols.length)];
  }

  function spawnFlyingHearts(card){
    const overlay = document.createElement('div');
    overlay.className = 'slot-hearts-overlay';
    card.appendChild(overlay);
    const HEARTS = ['❤️','💕','💖','💗'];
    let count = 0;
    const interval = setInterval(() => {
      for(let i=0;i<3;i++){
        const h = document.createElement('span');
        h.className = 'slot-flying-heart';
        h.textContent = HEARTS[Math.floor(Math.random()*HEARTS.length)];
        const left = Math.random()*90 + 5;
        const hx = (Math.random()*60 - 30).toFixed(0);
        const hr = (Math.random()*50 - 25).toFixed(0);
        const dur = (2.2 + Math.random()*1.4).toFixed(2);
        h.style.left = left + '%';
        h.style.setProperty('--hx', hx + 'px');
        h.style.setProperty('--hr', hr + 'deg');
        h.style.animationDuration = dur + 's';
        overlay.appendChild(h);
        h.addEventListener('animationend', () => h.remove());
      }
      count++;
    }, 260);
    dayCleanup = () => { clearInterval(interval); overlay.remove(); };
  }

  function spin(){
    btn.disabled = true;
    resultEl.classList.remove('show');
    resultEl.textContent = '';
    resultEl.className = 'slot-result';
    if(dayCleanup){ dayCleanup(); dayCleanup = null; }

    const isWin = Math.random() < winRate;
    let finalSymbols;
    let wonCombo = null;

    if(isWin){
      wonCombo = combos[Math.floor(Math.random() * combos.length)];
      finalSymbols = [wonCombo.symbol, wonCombo.symbol, wonCombo.symbol];
    } else {
      do {
        finalSymbols = [randSymbol(), randSymbol(), randSymbol()];
      } while(finalSymbols[0] === finalSymbols[1] && finalSymbols[1] === finalSymbols[2]);
    }

    const stopDelays = [900, 1400, 1950];
    reels.forEach((reel, i) => {
      reel.classList.add('spinning');
      reel.classList.remove('landed');
      const flicker = setInterval(() => { reel.textContent = randSymbol(); }, 70);
      setTimeout(() => {
        clearInterval(flicker);
        reel.classList.remove('spinning');
        reel.textContent = finalSymbols[i];
        reel.classList.add('landed');
      }, stopDelays[i]);
    });

    setTimeout(() => {
      if(isWin){
        if(wonCombo.type === 'hearts_flood'){
          const card = document.getElementById('content-card');
          spawnFlyingHearts(card);
          resultEl.textContent = "Coup de coeur. Littéralement.";
        } else {
          resultEl.textContent = wonCombo.text;
        }
        resultEl.classList.add('show');
      } else {
        resultEl.classList.add('miss');
        resultEl.textContent = "Raté... on retente ?";
        resultEl.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Rejouer 🎰';
    }, stopDelays[2] + 150);
  }

  btn.addEventListener('click', spin);
}

function initRapport(data){
  const root = document.getElementById('rapport-root');

  const tableauHtml = `
    <table class="rapport-table">
      <thead>
        <tr>
          <th>Plateforme</th>
          <th>Sujet</th>
          <th class="num">Chef</th>

          <th class="num">🫡</th>

/* ---------- LEGO 3D (jour 23) ---------- */
function initLego3D(glbPath) {
  const wrap = document.getElementById('lego-3d-wrap');
  const canvas = document.getElementById('lego-canvas');
  if (!wrap || !canvas) return;

  // Charger Three.js + GLTFLoader via ES Modules
  Promise.all([
    import('three'),
    import('three/addons/loaders/GLTFLoader.js')
  ]).then(function([THREE, { GLTFLoader }]) {
      const W = wrap.clientWidth, H = wrap.clientHeight;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1218);
      scene.fog = new THREE.Fog(0x1a1218, 15, 30);

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.01, 100);
      camera.position.set(0, 0.5, 2.5);

      // Lumières
      const amb = new THREE.AmbientLight(0xfff5ee, 1.2);
      scene.add(amb);
      const key = new THREE.DirectionalLight(0xffffff, 2.5);
      key.position.set(2, 4, 3);
      key.castShadow = true;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xaaddff, 0.8);
      fill.position.set(-3, 2, 1);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffccaa, 0.6);
      rim.position.set(0, -1, -3);
      scene.add(rim);

      // Charger le GLB
      const loader = new GLTFLoader();
      loader.load(glbPath, function(gltf) {
        const model = gltf.scene;

        // Centrer et redimensionner
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 1.8 / maxDim;
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        model.position.y -= size.y * scale * 0.3;

        scene.add(model);

        // Orbit controls manuels
        let isDragging = false, prevX = 0, prevY = 0;
        let theta = 0, phi = 0.15, radius = 2.5;
        const target = new THREE.Vector3(0, 0, 0);

        function updateCam() {
          camera.position.set(
            target.x + radius * Math.sin(theta) * Math.cos(phi),
            target.y + radius * Math.sin(phi),
            target.z + radius * Math.cos(theta) * Math.cos(phi)
          );
          camera.lookAt(target);
        }
        updateCam();

        canvas.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', e => {
          if (!isDragging) return;
          theta -= (e.clientX - prevX) * 0.01;
          phi = Math.max(-0.3, Math.min(0.7, phi + (e.clientY - prevY) * 0.006));
          prevX = e.clientX; prevY = e.clientY;
          updateCam();
        });
        canvas.addEventListener('wheel', e => {
          radius = Math.max(1.2, Math.min(5, radius + e.deltaY * 0.003));
          updateCam(); e.preventDefault();
        }, { passive: false });

        let lastTX = 0, lastTY = 0;
        canvas.addEventListener('touchstart', e => { lastTX = e.touches[0].clientX; lastTY = e.touches[0].clientY; });
        canvas.addEventListener('touchmove', e => {
          theta -= (e.touches[0].clientX - lastTX) * 0.012;
          phi = Math.max(-0.3, Math.min(0.7, phi + (e.touches[0].clientY - lastTY) * 0.007));
          lastTX = e.touches[0].clientX; lastTY = e.touches[0].clientY;
          updateCam(); e.preventDefault();
        }, { passive: false });

        // Rotation auto douce
        let autoRotate = true;
        canvas.addEventListener('mousedown', () => autoRotate = false);
        canvas.addEventListener('touchstart', () => autoRotate = false);

        // Masquer le hint après interaction
        const hint = wrap.querySelector('.lego-3d-hint');
        canvas.addEventListener('mousedown', () => { if (hint) hint.style.opacity = '0'; });

        function animate() {
          requestAnimationFrame(animate);
          if (autoRotate) { theta += 0.005; updateCam(); }
          renderer.render(scene, camera);
        }
        animate();

      }, undefined, function(err) {
        console.error('GLB load error', err);
        wrap.innerHTML = '<p style="color:#fff;text-align:center;padding:40px;opacity:0.5;">Modèle 3D non disponible</p>';
      });
  }).catch(function(err) {
    console.error('Erreur chargement Three.js', err);
    wrap.innerHTML = '<p style="color:#fff;text-align:center;padding:40px;opacity:0.5;">Modèle 3D non disponible</p>';
  });
}

  function animCount(el, target, duration){
    const start = performance.now();
    function step(now){
      const t = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(ease * target).toLocaleString('fr-FR');
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

function initDatesQuiz(data, dayNum){
  const root=document.getElementById('datesquiz-root');
  if(!root) return;
  const questions=data.questions;
  let saved=DayState.load(dayNum);
  let answers, current, state;
  if(saved&&saved.type==='datesquiz'){ answers=saved.answers||[]; current=saved.current||0; state=saved.state||'playing'; }
  else { answers=[]; current=0; state='playing'; DayState.save(dayNum,{type:'datesquiz',answers:[],current:0,state:'playing'}); }
  if(state==='won'||current>=questions.length){ renderDatesResult(data,answers,dayNum); return; }

  const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  function parseInput(raw){
    const s=raw.trim().toLowerCase().replace(/\//g,'-').replace(/\s+/g,' ').replace(/1er/,'1');
    let m=s.match(/^(\d{1,2})[-\/](\d{1,2})$/);
    if(m) return {day:parseInt(m[1]),month:parseInt(m[2])};
    for(let i=0;i<MOIS.length;i++){
      const re=new RegExp('(\\d{1,2})\\s*'+MOIS[i].substring(0,4));
      const match=s.match(re);
      if(match) return {day:parseInt(match[1]),month:i+1};
    }
    return null;
  }

  function checkAnswer(parsed,q){
    if(!parsed) return false;
    const targets=Array.isArray(q.answer)?q.answer:[q.answer];
    return targets.some(t=>t.day===parsed.day&&t.month===parsed.month);
  }

  function saveState(){ DayState.save(dayNum,{type:'datesquiz',answers,current,state:current>=questions.length?'won':'playing'}); }

  function renderQuestion(){
    if(current>=questions.length){ saveState(); renderDatesResult(data,answers,dayNum); return; }
    const q=questions[current];
    root.innerHTML=`<div class="dq-progress">${current+1} / ${questions.length}</div><div class="dq-question">${q.question}</div><div style="display:flex;gap:8px;margin-bottom:10px;"><input id="dq-day" class="dq-input" style="width:70px;" type="number" placeholder="Jour" min="1" max="31"><input id="dq-month" class="dq-input" style="flex:1;" type="number" placeholder="Mois" min="1" max="12"></div><button class="dq-btn" id="dq-btn">Valider</button><div class="dq-feedback" id="dq-feedback"></div>`;
    const dayIn=document.getElementById('dq-day'),monthIn=document.getElementById('dq-month'),btn=document.getElementById('dq-btn'),fb=document.getElementById('dq-feedback');
    btn.addEventListener('click',()=>{
      const d=parseInt(dayIn.value)||0,m=parseInt(monthIn.value)||0;
      const targets=Array.isArray(q.answer)?q.answer:[q.answer];
      const correct=targets.some(t=>t.day===d&&t.month===m);
      answers.push({given:{day:d,month:m},correct}); saveState();
      fb.textContent=correct?'✓ Bonne réponse !':(q.taquin||'Pas exactement...');
      fb.className='dq-feedback '+(correct?'dq-ok':'dq-wrong');
      btn.disabled=true;
      setTimeout(()=>{ current++; saveState(); renderQuestion(); },1800);
    });
    [dayIn,monthIn].forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); }));
  }

  renderQuestion();

  if(!document.getElementById('dq-style')){
    const s=document.createElement('style'); s.id='dq-style';
    s.textContent=`#datesquiz-root{margin-top:22px;}.dq-progress{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-soft);margin-bottom:14px;}.dq-question{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink);margin-bottom:16px;}.dq-input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--ink);font-family:var(--sans);margin-bottom:10px;text-align:center;}.dq-input:focus{outline:none;border-color:var(--accent);}.dq-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;margin-bottom:10px;}.dq-btn:disabled{opacity:0.4;cursor:not-allowed;}.dq-feedback{font-size:13px;line-height:1.5;min-height:20px;color:var(--ink-soft);font-style:italic;}.dq-feedback.dq-ok{color:#4a8c5c;font-style:normal;font-weight:600;}.dq-feedback.dq-wrong{color:var(--accent);}.dq-result{text-align:center;padding:20px 0 10px;}.dq-score{font-size:64px;font-weight:800;color:var(--accent);font-family:var(--sans);line-height:1;}.dq-score span{font-size:28px;color:var(--ink-soft);}.dq-result-msg{font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink);margin:16px 0 8px;}.dq-result-sub{font-size:13px;color:var(--ink-soft);}`;
    document.head.appendChild(s);
  }
}

function renderDatesResult(data, answers, dayNum){
  const root=document.getElementById('datesquiz-root');
  if(!root) return;
  const score=answers.filter(a=>a.correct).length,total=answers.length;
  let msg;
  if(score===total) msg="Parfait. T'as tout juste. Je t'aime encore plus là.";
  else if(score>=total*0.7) msg="Pas mal du tout. Y'a quelques trous mais t'as retenu l'essentiel.";
  else if(score>=total*0.4) msg="Bof bof... on repassera les dates ensemble un jour.";
  else msg="Aziyadé... t'as oublié nos dates. Je suis blessé. (non je rigole je t'aime)";
  root.innerHTML=`<div class="dq-result"><div class="dq-score">${score}<span>/${total}</span></div><div class="dq-result-msg">${msg}</div><div class="dq-result-sub">Joyeux 6 mois ❤️</div></div><button class="btn-restart" onclick="restartDay(${dayNum},'datesquiz')">Recommencer ↺</button>`;
}

function launchJumpScare(src){
  const overlay = document.getElementById('js-overlay');
  const video   = document.getElementById('js-video');
  const closeBtn= document.getElementById('js-close');
  const flash   = document.getElementById('js-flash');

  video.src = src;
  overlay.classList.add('visible');
  document.body.style.overflow = 'hidden';

  video.play().catch(()=>{});

  // Flash blanc + vibration à la fin
  video.addEventListener('timeupdate', function onTime(){
    if(video.duration && video.currentTime >= video.duration - 0.6){
      video.removeEventListener('timeupdate', onTime);
      flash.style.opacity = '1';
      if(navigator.vibrate) navigator.vibrate([80, 40, 120]);
      setTimeout(()=>{ flash.style.opacity = '0'; }, 120);
    }
  });

  // Affiche le bouton fermer après la fin
  video.addEventListener('ended', function(){
    closeBtn.style.opacity = '1';
  });
}

function closeJumpScare(){
  const overlay = document.getElementById('js-overlay');
  const video   = document.getElementById('js-video');
  video.pause();
  video.src = '';
  overlay.classList.remove('visible');
  document.getElementById('js-close').style.opacity = '0';
  document.body.style.overflow = '';
}

function closeDay(){
  const panel = document.getElementById('content-panel');
  panel.classList.remove('visible');
  document.body.style.overflow = '';
  if(dayCleanup){ dayCleanup(); dayCleanup = null; }
}

document.addEventListener('click', function(e){
  const panel = document.getElementById('content-panel');
  if(panel.classList.contains('visible') && e.target === panel){
    closeDay();
  }
});
document.addEventListener('keydown', function(e){

});

document.getElementById('pwd-form').addEventListener('submit', function(e){
  e.preventDefault();

/* ============================================================
   DayState — sauvegarde localStorage
   ============================================================ */
const DayState = {
  save(day, data){ try{ localStorage.setItem('day_'+day, JSON.stringify(data)); }catch(e){} },
  load(day){ try{ const v=localStorage.getItem('day_'+day); return v?JSON.parse(v):null; }catch(e){ return null; } },
  clear(day){ try{ localStorage.removeItem('day_'+day); }catch(e){} }
};

/* Hook de nettoyage pour les animations continues (ex: pluie de coeurs) */
let dayCleanup = null;

function restartDay(dayNum, gameType){
  DayState.clear(dayNum);
  const data=CONTENT[dayNum];
  if(!data) return;
  const card=document.getElementById('content-card');
  if(gameType==='memory'){
    card.innerHTML=`<div class="drag-handle"></div><div class="close-card" onclick="closeDay()">&times;</div><div class="content-tag">${TAG_LABELS.minigame}</div><div class="memory-intro">${data.text}</div><div id="memory-root"></div>`;
    initMemoryGame(data,dayNum);
  } else if(gameType==='puzzle'){
    card.innerHTML=`<div class="drag-handle"></div><div class="close-card" onclick="closeDay()">&times;</div><div class="content-tag">${TAG_LABELS.wordpuzzle}</div><div class="memory-intro">${data.text}</div><div id="puzzle-root"></div>`;
    initWordPuzzle(data,dayNum);
  } else if(gameType==='datesquiz'){
    card.innerHTML=`<div class="drag-handle"></div><div class="close-card" onclick="closeDay()">&times;</div><div class="content-tag">Petit quiz</div><div class="content-text">${data.intro}</div><div id="datesquiz-root" class="reveal"></div>`;
    initDatesQuiz(data,dayNum);
  } else if(gameType==='puzzlephoto'){
    card.innerHTML=`<div class="drag-handle"></div><div class="close-card" onclick="closeDay()">&times;</div><div class="content-tag">${TAG_LABELS.puzzlephoto}</div><div class="memory-intro">${data.text}</div><div id="puzzlephoto-root"></div>`;
    initPuzzlePhoto(data,dayNum);
  }
}

/* Wrapped : sauvegarde slide courante */
function initWrapped(data, dayNum){
  initWrappedBase(data);
  const saved=DayState.load(dayNum);
  const startSlide=(saved&&saved.type==='wrapped')?(saved.slide||0):0;
  setTimeout(()=>{
    if(startSlide>0){ const btn=document.getElementById('w-tap-next'); for(let i=0;i<startSlide;i++) if(btn) btn.click(); }
    ['w-tap-next','w-tap-prev'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.addEventListener('click',()=>{
        const active=document.querySelector('.wrapped-slide.active');
        if(active){ DayState.save(dayNum,{type:'wrapped',slide:parseInt(active.id.replace('w-slide-',''))||0}); }
      });
    });
  },300);
}
